<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIBB — Musikvidenskabeligt Instituts Bigband</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a0a2e; min-height: 100vh; }

    .page {
      min-height: 100vh;
      width: 100%;
      background:
        radial-gradient(ellipse at 0% 0%, #ff6a00 0%, transparent 55%),
        radial-gradient(ellipse at 100% 0%, #c0392b 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, #6c1fa8 0%, transparent 60%),
        linear-gradient(160deg, #e8400a 0%, #9b1c6b 40%, #2d0b6e 100%);
      font-family: 'Space Mono', monospace;
      color: #fff;
      position: relative;
      overflow-x: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 4rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      position: relative;
      z-index: 10;
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.1em;
      color: #ffb347;
    }

    .nav-links { display: flex; gap: 0.5rem; }

    .nav-link {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      transition: all 0.2s;
    }
    .nav-link:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-color: rgba(255,255,255,0.35);
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5rem 4rem 4rem;
      gap: 2rem;
      position: relative;
      z-index: 10;
    }

    .hero-text { flex: 1; }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,180,100,0.8);
      margin-bottom: 1rem;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 12vw, 10rem);
      line-height: 0.9;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #fff 0%, #ffb347 50%, #ff6a00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 300% 300%;
      margin-bottom: 0.75rem;
      animation: logoPulse 4s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%   { background-position: 0% 50%;   letter-spacing: 0.04em; }
      50%  { background-position: 100% 50%; letter-spacing: 0.2em; }
      100% { background-position: 0% 50%;   letter-spacing: 0.04em; }
    }

    .subtitle {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 1.25rem;
    }

    .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 10px 22px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary { background: #ff6a00; color: #fff; border: 1px solid #ff6a00; }
    .btn-primary:hover { background: #ff8c33; transform: translateY(-2px); }
    .btn-ghost { background: transparent; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.3); }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: #fff; transform: translateY(-2px); }
    .btn-sm { padding: 5px 14px; font-size: 0.65rem; }

    .trumpet-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 300px;
      height: 300px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .trumpet-wrap svg {
      width: 100%;
      height: 100%;
      will-change: transform;
      transition: filter 0.3s;
    }

    .ticker-wrap {
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.12);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.2);
      padding: 10px 0;
      position: relative;
      z-index: 10;
    }

    .ticker-track {
      display: flex;
      animation: marquee 22s linear infinite;
      white-space: nowrap;
    }

    .ticker-item {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: rgba(255,200,140,0.75);
      padding: 0 2rem;
      flex-shrink: 0;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .section {
      padding: 3rem 4rem;
      position: relative;
      z-index: 10;
      width: 100%;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,180,100,0.7);
      margin-bottom: 1.25rem;
    }

    .gig-card {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1rem 1.25rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      margin-bottom: 10px;
      backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    .gig-card:hover { background: rgba(255,255,255,0.09); }

    .gig-date {
      font-size: 0.65rem;
      color: rgba(255,180,100,0.8);
      letter-spacing: 0.05em;
      min-width: 60px;
      line-height: 1.5;
    }

    .gig-info { flex: 1; }
    .gig-name { font-size: 0.78rem; font-weight: 700; margin-bottom: 3px; }
    .gig-venue { font-size: 0.68rem; color: rgba(255,255,255,0.45); }

    .badge-sold {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      padding: 3px 10px;
      background: rgba(192,57,43,0.35);
      color: #ff9090;
      border-radius: 4px;
      border: 1px solid rgba(192,57,43,0.5);
      white-space: nowrap;
    }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .member-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 1.1rem 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, background 0.2s;
    }
    .member-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.09); }
    .member-icon { font-size: 1.5rem; }
    .member-name { font-size: 0.72rem; font-weight: 700; text-align: center; }
    .member-count { font-size: 0.62rem; color: rgba(255,255,255,0.4); text-align: center; }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 4rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      position: relative;
      z-index: 10;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .live-dot {
      animation: pulse 3s ease-in-out infinite;
      color: rgba(255,200,100,0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    @media (max-width: 768px) {
      nav    { padding: 1rem 1.5rem; }
      .hero  { flex-direction: column; padding: 2.5rem 1.5rem 2rem; text-align: center; }
      .hero-btns { justify-content: center; }
      .trumpet-wrap { width: 200px; height: 200px; }
      .section { padding: 2rem 1.5rem; }
      footer { padding: 1.25rem 1.5rem; flex-direction: column; align-items: center; text-align: center; }
    }
  </style>
</head>

    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <section class="section" id="gigs">
    <p class="section-label">Upcoming Gigs</p>
    <div id="gigsContainer"></div>
  </section>

  <section class="section" id="about">
    <p class="section-label">The Band</p>
    <div class="members-grid" id="membersGrid"></div>

<script>
  // --- Spinning trumpet ---
  const svg = document.getElementById('trumpet');
  const wrap = document.getElementById('trumpetWrap');
  let rotation = 0;
  let hovered = false;
  let last = performance.now();

  wrap.addEventListener('mouseenter', () => hovered = true);
  wrap.addEventListener('mouseleave', () => hovered = false);

  function spin(now) {
    const speed = hovered ? 0.5 : 0.12;
    rotation += (now - last) * speed;
    last = now;
    svg.style.transform = `rotate(${rotation}deg)`;
    svg.style.transformOrigin = 'center';
    svg.style.filter = `drop-shadow(0 0 ${hovered ? 60 : 30}px rgba(255,106,0,${hovered ? 0.7 : 0.4}))`;
    requestAnimationFrame(spin);
  }
  requestAnimationFrame(spin);

  // --- Ticker ---
  const ticker = [
    'Tower of Power', 'Mads Pagsberg', 'Sif', 'Jazz', 'Swing', 'Bossa Nova',
    'Songs We Misremembered', 'That Thing From The Thing', 'We Call It "Avant-garde"',
    "Our Drummer's Birthday Polka", 'Mostly In Tune',
  ];

  const track = document.getElementById('tickerTrack');
  [...ticker, ...ticker].forEach(item => {
    const span = document.createElement('span');
    span.className = 'ticker-item';
    span.textContent = `♩ ${item}`;
    track.appendChild(span);
  });

  // --- Gigs ---
  const gigs = [
    { date: 'MAY 16', year: '2026', name: 'Tivoli concert', venue: 'Tivoli, Copenhagen', soldOut: false },
    { date: 'MAY 16', year: '2026', name: 'Tivoli concert', venue: 'Tivoli, Copenhagen', soldOut: false },
    { date: 'MAY 16', year: '2026', name: 'Tivoli concert', venue: 'Tivoli, Copenhagen', soldOut: false },
    { date: 'MAY 16', year: '2026', name: 'Tivoli concert', venue: 'Tivoli, Copenhagen', soldOut: false },
  ];

  const gigsContainer = document.getElementById('gigsContainer');
  gigs.forEach(gig => {
    const card = document.createElement('div');
    card.className = 'gig-card';
    card.innerHTML = `
      <span class="gig-date">${gig.date}<br>${gig.year}</span>
      <div class="gig-info">
        <div class="gig-name">${gig.name}</div>
        <div class="gig-venue">${gig.venue}</div>
      </div>
      ${gig.soldOut
        ? '<span class="badge-sold">Sold Out</span>'
        : '<button class="btn btn-ghost btn-sm">Tickets ↗</button>'
      }
    `;
    gigsContainer.appendChild(card);
  });

  // --- Members ---
  const members = [
    { icon: '🎺', name: 'Trumpet', count: '×6' },
    { icon: '🎷', name: 'Sax', count: '×4' },
    { icon: '🎸', name: 'Bass', count: '×2' },
    { icon: '🥁', name: 'Drums', count: '×1' },
    { icon: '🎹', name: 'Piano', count: '×1' },
    { icon: '🎺', name: 'Trombone', count: '×3' },
  ];

  const grid = document.getElementById('membersGrid');
  members.forEach(m => {
    const card = document.createElement('div');
    card.className = 'member-card';
    card.innerHTML = `
      <span class="member-icon">${m.icon}</span>
      <span class="member-name">${m.name}</span>
      <span class="member-count">${m.count}</span>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
